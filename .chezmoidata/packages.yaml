packages:
  darwin:
    brews:
      - bat
      - cheat
      - glow
      - curl
      - diffnav
      - direnv
      - fd
      - fzf
      - fish
      - gh
      - git
      - git-delta
      - go-task
      - herdr
      - k9s
      - lazygit
      - navi
      - neovim
      # pi's runtime (ADR-0012) — was an implicit dependency of the retired
      # pi-coding-agent formula; declared so the npm tier below owns it and
      # the weekly formula sweep keeps it current (autobumped in core).
      - node
      - ripgrep
      - wget
      - yazi
      - zoxide
      - zsh
    # Intentionally empty. go-task/tap was dropped 2026-08-19: upstream
    # migrated the formula to homebrew-core (the installed keg's receipt
    # already read homebrew/core, so the tap installed nothing) and the tap
    # now ships only a cask, which Homebrew 6 refuses to load from an
    # untrusted tap — failing the whole `brew bundle` fetch, not just
    # go-task. The tap loop in run_before_all-02 stays: presence is data,
    # mechanism is code (ADR-0011).
    taps: []
    casks:
      - 1password-cli
      - ghostty
      - karabiner-elements
      - wezterm
      - zed
  fedora:
    copr:
      # lazygit is not in official Fedora repos; atim's copr is the de facto
      # source (ghostty likewise comes from the Terra repo, added in
      # run_before_all-01 — everything else in the dnf list is official).
      - atim/lazygit
    dnf:
      - 1password
      - 1password-cli
      - bat
      - cheat
      - glow
      - code
      - curl
      - direnv
      - fd
      - fzf
      - fish
      - ghostty
      - git
      - gh
      - git-delta
      - gnome-shell-extension-pop-shell
      - keyd
      - xprop
      - lazygit
      - k9s
      - navi
      - neovim
      # Runtime for the npm tier (ADR-0011/0012) — not project tooling;
      # project node stays with nvm/direnv. Declared here so dnf installs
      # them and the weekly sweep keeps them current.
      - nodejs
      - npm
      - ripgrep
      - task
      - wget
      - yazi
      - zoxide
  # Global npm CLIs, both platforms (ADR-0011/0012). Mechanism lives in
  # .chezmoitemplates/npm-tools (pinned-interpreter wrappers + refuse-to-link
  # smoke test); installed-if-missing by run_before_all-02. pi is NOT swept by
  # npm_tier_sync weekly — it updates itself via `pi update --all` in
  # run_onchange_upgrade-packages (ADR-0012).
  npm:
    - "@earendil-works/pi-coding-agent"
