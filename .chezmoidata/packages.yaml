packages:
  darwin:
    brews:
      - bat
      - cheat
      - glow
      - curl
      - diffnav
      - direnv
      - fd
      - fzf
      - fish
      - gh
      - git
      - git-delta
      - go-task
      - herdr
      - k9s
      - lazygit
      - navi
      - neovim
      - pi-coding-agent
      - ripgrep
      - wget
      - yazi
      - zoxide
      - zsh
    taps:
      - go-task/tap/go-task
    casks:
      - 1password-cli
      - ghostty
      - karabiner-elements
      - wezterm
      - zed
  fedora:
    copr:
      - atim/lazygit
    dnf:
      - 1password
      - 1password-cli
      - bat
      - cheat
      - glow
      - code
      - curl
      - direnv
      - fd
      - fzf
      - fish
      - ghostty
      - git
      - gh
      - git-delta
      - gnome-shell-extension-pop-shell
      - keyd
      - xprop
      - lazygit
      - k9s
      - navi
      - neovim
      # Runtime for the npm tier below (ADR-0011) — not project tooling;
      # project node stays with nvm/direnv. Declared here so dnf installs
      # them and the weekly sweep keeps them current.
      - nodejs
      - npm
      - ripgrep
      - task
      - wget
      - yazi
      - zoxide
    # Global npm CLIs. Mechanism lives in .chezmoitemplates/npm-tools
    # (pinned-interpreter wrappers + downgrade detection); installed by
    # run_before_all-02 and upgraded by the weekly sweep, same as every other
    # tier. macOS gets pi from brew instead — see ADR-0011.
    npm:
      - "@earendil-works/pi-coding-agent"
